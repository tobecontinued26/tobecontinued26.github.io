<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Be Continued</title>
<link rel="icon" href="icon.png">
<style>
  @font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-Medium.woff) format('woff')}
  html,body{margin:0;height:100%;background:#fff;font-family:Inter,-apple-system,system-ui,sans-serif}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;box-sizing:border-box}
  .bar{display:flex;width:min(300px,70vw);height:7px}
  .bar i{flex:1} .bar i:nth-child(1){background:#E73D7D} .bar i:nth-child(2){background:#4DABE9}
  .bar i:nth-child(3){background:#FDFF64} .bar i:nth-child(4){background:#000} .bar i:nth-child(5){background:#E73D7D}
  img{width:min(360px,72vw);height:auto}
  p{margin:0;font-size:18px;font-weight:500;color:#333;max-width:420px;line-height:1.45}
</style>
</head>
<body>
  <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <img src="logo.png" alt="To Be Continued">
  <p>Fall 26 Senior Show ♡<br>Scan the code at the photobooth to get your strip.</p>
</body>
</html>
