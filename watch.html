<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Your Photo Strip</title>
<link rel="icon" href="icon.png">
<style>
  @font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-Regular.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-Medium.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-SemiBold.woff) format('woff')}
  @font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-Bold.woff) format('woff')}
  :root{--mag:#FD65A5;--cyan:#00AEEF;--yel:#F9EE06;--card:#F4F7EE}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:#000;font-family:Inter,-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
  body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:20px;
    padding:max(24px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
  .bar{display:flex;width:min(300px,80vw);height:6px}
  .bar i{flex:1} .bar i:nth-child(1){background:#E73D7D} .bar i:nth-child(2){background:#4DABE9} .bar i:nth-child(3){background:#FDFF64}
  .bar i:nth-child(4){background:#000} .bar i:nth-child(5){background:#E73D7D}
  h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-0.01em;text-transform:uppercase;text-align:center}
  .media{height:min(46dvh,540px);aspect-ratio:1/3;background:#e9e9e9;box-shadow:0 12px 30px rgba(0,0,0,.18);position:relative}
  .media video,.media img{width:100%;height:100%;display:block;object-fit:cover}
  .btn{font:inherit;font-size:18px;font-weight:600;background:#000;color:#fff;border:0;width:min(300px,86vw);height:56px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-decoration:none}
  .btn:disabled{background:#8c8c8c}
  .card{background:var(--card);border-radius:11px;padding:16px 18px;width:min(300px,86vw)}
  ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  li{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;text-transform:uppercase;letter-spacing:.01em}
  li b{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff}
  li:nth-child(1) b{background:var(--mag)} li:nth-child(2) b{background:var(--cyan)} li:nth-child(3) b{background:var(--yel);color:#000}
  .note{font-size:13px;color:#777;text-align:center;max-width:300px;line-height:1.4}
  /* live + photo side by side */
  .pair{display:flex;gap:8px;justify-content:center;align-items:flex-start}
  figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px}
  figcaption{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:#444}
  .pair.two .media{height:min(44dvh,520px)}
  .btns{display:flex;flex-direction:column;gap:10px;align-items:center}
  .btn.alt{background:#fff;color:#000;border:2px solid #000}
  .btn.alt:disabled{color:#8c8c8c;border-color:#8c8c8c;background:#fff}
  .err{color:#b00}
</style>
</head>
<body>
  <div class="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <h1>Your photo strip</h1>
  <div class="pair" id="pair"></div>
  <div class="btns" id="btns"></div>
  <div class="card">
    <ol id="steps">
      <li><b>01</b><span id="step1">Tap the button above</span></li>
      <li><b>02</b><span id="step2">Choose “Save Video”</span></li>
      <li><b>03</b><span id="step3">Find it in your photos ♡</span></li>
    </ol>
  </div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const cloud = (q.get('c') || 'f6qum3qh').replace(/[^\w-]/g, ''), id = (q.get('id') || '').replace(/[^\w\-\/]/g, '');
  // t=i → photo only · default → live video · p=1 → the photo strip is there too
  const kinds = q.get('t') === 'i' ? ['image'] : (q.get('p') === '1' ? ['video', 'image'] : ['video']);
  const android = /Android/i.test(navigator.userAgent);   // Android: a plain download lands in the Gallery / Google Photos
  if (!id) { $('btns').innerHTML = '<button class="btn" disabled>link is missing its photo</button>'; return; }

  const items = kinds.map(k => {
    const base = `https://res.cloudinary.com/${cloud}/${k}/upload`, ext = k === 'video' ? 'mp4' : 'jpg';
    return { k, url: `${base}/${id}.${ext}`, dl: `${base}/fl_attachment/${id}.${ext}`, name: `photo-strip.${ext}`,
             type: k === 'video' ? 'video/mp4' : 'image/jpeg', label: k === 'video' ? 'save video' : 'save photo', file: null };
  });

  // preview: the live video (looping) and the photo strip, side by side
  const pair = $('pair'); pair.classList.toggle('two', items.length > 1);
  items.forEach(it => {
    const fig = document.createElement('figure'), box = document.createElement('div'); box.className = 'media';
    if (it.k === 'video') {
      const v = document.createElement('video');
      Object.assign(v, { src: it.url, muted: true, loop: true, autoplay: true, playsInline: true });
      v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); box.appendChild(v); v.play().catch(() => {});
    } else { const im = document.createElement('img'); im.src = it.url; im.alt = 'your photo strip'; box.appendChild(im); }
    fig.appendChild(box);
    if (items.length > 1) { const cap = document.createElement('figcaption'); cap.textContent = it.k === 'video' ? 'live' : 'photo'; fig.appendChild(cap); }
    pair.appendChild(fig);
  });

  // steps
  const both = items.length > 1, onlyImg = items[0].k === 'image';
  $('step1').textContent = 'Tap “save to photos”';
  $('step2').textContent = android ? (both ? 'Both save to your gallery' : 'It saves to your gallery')
    : both ? 'Choose “Save 2 Items”' : onlyImg ? 'Choose “Save Image”' : 'Choose “Save Video”';

  if (both) $('step3').textContent = 'Find them in your photos ♡';
  // one button saves every version at once; the files are downloaded ahead so the tap opens the share sheet straight away
  const b = document.createElement('button'); b.className = 'btn'; b.disabled = true; b.textContent = 'getting your strip…';
  $('btns').appendChild(b);
  Promise.all(items.map(it => fetch(it.url).then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); })
    .then(bl => { it.file = new File([bl], it.name, { type: it.type }); }).catch(() => {}))).then(() => {
    const ready = items.filter(it => it.file);
    if (!ready.length) {
      // couldn't fetch them (old browser or blocked): plain download links instead
      b.remove();
      items.forEach((it, n) => { const a = document.createElement('a'); a.className = 'btn' + (n ? ' alt' : ''); a.href = it.dl; a.setAttribute('download', it.name);
        a.textContent = it.k === 'video' ? 'download video' : 'download photo'; $('btns').appendChild(a); });
      $('step2').textContent = android ? 'Open the download — it’s in your gallery' : 'Open the download, tap share, then save it';
      return;
    }
    b.disabled = false; b.textContent = 'save to photos';
    b.addEventListener('click', async () => {
      const files = ready.map(it => it.file);
      if (!android && navigator.canShare && navigator.canShare({ files })) { try { await navigator.share({ files }); } catch (e) {} return; }
      for (const f of files) {   // Android / desktop: download each one
        const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
        await new Promise(r => setTimeout(r, 600));
      }
    });
  });
})();
</script>
</body>
</html>
